# The gateway of the conformance suite: northwind on its path, every transport on (the legacy HTTP+SSE of MCP too)
# and two credentials. Only for tests: the keys are public. The same file serves the image (docker-compose.yml) and
# the gateway run from source (scripts/ci-local.sh clients), which give the workspace, the connection and the ports.
orm:
  workspacePath: $CONFORMANCE_WORKSPACE
  schemas:
    - path: northwind
      env: { NORTHWIND_DB: $NORTHWIND_DB }
# the keys of the services, and the tokens of the users (docs/JWT.md): HS256 with a secret of the suite (the runner signs them)
authentication:
  methods:
    - adapter: jwt
      issuer: https://conformance.lambdaorm
      audience: data-gateway
      secret: conformance-jwt-secret-of-32-bytes!!
      principal:
        name: sub
        permissions:
          claim: roles
          roles:
            reader: [ read ]
            backend: [ read, write, script, queue, stageImport ]
            sales: { permissions: [ read ], view: sales }
      context: { tenant: tenant, country: country }
    - adapter: local
      type: apikey
      header: X-Api-Key
      keys:
        - { name: reader,  value: conformance-reader-key,  permissions: [ read ] }
        - { name: backend, value: conformance-backend-key, permissions: [ read, write, script, queue, stageImport ] }
# the cache of the reads on (docs/RESULT_CACHE.md): every case that writes and then reads checks its invalidation
cache: { enabled: true, ttl: 60s }
rateLimit: { windowMs: 30000, max: 0 }
scripts:
  enabled: true
mcp:
  maxRows: 50
transports:
  http:
    port: $CONFORMANCE_HTTP_PORT
  mcpHttp:
    port: $CONFORMANCE_MCP_HTTP_PORT
    legacySse: true
  mcpWebSocket:
    port: $CONFORMANCE_MCP_WS_PORT
  webSocket:
    port: $CONFORMANCE_WS_PORT
