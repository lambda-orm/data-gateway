# The data-gateway-ide: static files. The page itself never cached (a new version is seen on reload); its assets, named
# by their hash, kept for a year. It talks to the data-gateways the viewer connects to (connect-src: any).
server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;
	add_header Content-Security-Policy "default-src 'self'; connect-src * data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'" always;

	# an add_header in a location replaces those of the server: the page repeats them
	location = /index.html {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy no-referrer always;
		add_header Content-Security-Policy "default-src 'self'; connect-src * data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'" always;
	}
	location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
	location = /health { access_log off; default_type text/plain; return 200 'ok'; }
	location / { try_files $uri /index.html; }
}
