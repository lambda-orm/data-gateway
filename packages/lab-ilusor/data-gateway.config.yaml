# The data-gateway (lambda-orm/data-gateway) for the service tests: the same environment variables the former service
# read (docs/DATA_GATEWAY.md §2.7 of lambda-orm/data-gateway). Mounted as /config/data-gateway.config.yaml, or DATA_GATEWAY_CONFIG_PATH=<this file>.
# The published image of the compose file (flaviorita/lambdaorm-svc:2.4.0) doesn't use it: it reads
# infrastructure.service of lambdaORM.yaml.
orm:
  workspacePath: $WORKSPACE
authorization:
  roles:
    service: { permissions: [ read, write, script, queue, stageImport ] }
authentication:
  adapter: local
  type: bearer
  token: $SERVICE_TOKEN
  roles: [ service ]
rateLimit:
  windowMs: $RATE_LIMIT_WINDOWS_MS
  max: $RATE_LIMIT_MAX
scripts:
  enabled: $SCRIPT_ENABLED
server:
  requestBodySize: $REQUEST_BODY_SIZE
transports:
  http:
    port: $PORT
  # MCP (Streamable HTTP at /mcp) only when MCP_PORT is set: claude mcp add --transport http ilusor http://localhost:$MCP_PORT/mcp --header "Authorization: Bearer $SERVICE_TOKEN"
  mcpHttp:
    port: $MCP_PORT
  # the WebSocket API (JSON-RPC) only when WS_PORT is set: orm.init('ws://localhost:$WS_PORT')
  webSocket:
    port: $WS_PORT
