# The gateway for local development and debugging (.vscode/launch.json "data-gateway (dev)", or npm run dev in
# packages/data-gateway), run from the sources with tsx. The workspace is dev/workspace (not in git): dev/seed.mjs
# creates it the first time with northwind on SQLite (sql.js) and its data, so it needs no database server; delete
# dev/workspace/northwind to seed it again. sql.js writes its file when the gateway stops (SIGTERM, Ctrl+C).
# The keys are for this machine only.
orm:
  workspacePath: ./workspace
logger: { level: info }
audit: { enabled: true }
scripts: { enabled: true }
rateLimit: { max: 0 }
# false: a workspace seeded before SQLite (a PostgreSQL that isn't there) still starts
runtime: { checkConnections: false }
authentication:
  adapter: local
  type: apikey
  header: X-Api-Key
  keys:
    - { name: modeler, value: dev-modeler-key, permissions: [ read, write, script, queue, stageImport, schemaRead, schemaWrite, schemaAdmin, workbenchWrite, ddl, build, sessionAdmin ] }
    - { name: reader, value: dev-reader-key, permissions: [ read ] }
transports:
  http: { port: 19190, host: 127.0.0.1 }
  webSocket: { port: 19191, host: 127.0.0.1 }
  mcpHttp: { port: 19192, host: 127.0.0.1 }
  management:
    port: 19199
    host: 127.0.0.1
    trustedProxies: [ 127.0.0.1 ]
