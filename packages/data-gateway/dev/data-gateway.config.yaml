# The gateway for local development and debugging (.vscode/launch.json "data-gateway (dev)"), run from the sources with
# tsx. The workspace is dev/workspace (not in git), seeded with the northwind schema of the tests on the first launch.
# The keys are for this machine only.
orm:
  workspacePath: ./workspace
logger: { level: info }
audit: { enabled: true }
scripts: { enabled: true }
rateLimit: { max: 0 }
runtime: { checkConnections: false }
authentication:
  adapter: local
  type: apikey
  header: X-Api-Key
  keys:
    - { name: modeler, value: dev-modeler-key, permissions: [ read, write, script, queue, stageImport, schemaRead, schemaWrite, schemaAdmin, workbenchWrite, ddl, build, sessionAdmin ] }
    - { name: reader, value: dev-reader-key, permissions: [ read ] }
transports:
  http: { port: 19190, host: 127.0.0.1 }
  webSocket: { port: 19191, host: 127.0.0.1 }
  mcpHttp: { port: 19192, host: 127.0.0.1 }
  management:
    port: 19199
    host: 127.0.0.1
    trustedProxies: [ 127.0.0.1 ]
