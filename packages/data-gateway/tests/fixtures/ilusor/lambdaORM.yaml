# Cloud's data — ONE λORM schema (docs/CLOUD_DATA_ACCESS.md D2): one domain with every entity of Cloud's Postgres
# schemas (common, iot_catalog, crm, iam, sales, perception, iot_location) and of the FerretDB documents
# (ilusor-sales: quotes, installation_reports; ilusor-iot_location: processes), one mapping and one source per schema /
# documents database. Stage `default` routes each entity to its source with the schema's DML user (iot_location last,
# without condition); stage `ddl` the same with the schema owners, for push / fetch (D4).
# Built on 2026-11-20 from the database after docs/plan/DATABASE_SCRIPTS_PLAN.md scripts 01–30 (the one-off pull of
# D4, with Ilusor's naming rules); from now on this file is the source of truth: a change here → `push -o` → a
# reviewed SQL script under services/<owner>/sql/<schema>/.
# Every object of a Postgres schema carries the schema's prefix (cmn_, cat_, crm_, iam_, sal_, per_, loc_; scripts
# 31–37): entities, properties and relations are named without it, each entity's mapping names the prefixed table.
# What the model can't say is in the SQL scripts: partitions by location (iot_location, perception), CHECKs, partial
# unique indexes, deferrable foreign keys, ON DELETE SET NULL (col). Relations between schemas are `weak` (no FK).
# Every foreign key of iot_location is (location_id, x): a relation of several fields (`from: [locationId, areaId]`,
# `to: [locationId, code]`, λORM L34), so a row only reaches rows of its own location. MongoDB sources (FerretDB):
# connection `transactions: false`, `uuid: binary`, `decimal: decimal128` (λORM L35, L37).
