# data-gateway for the MCP evaluation set (eval/README.md)
orm:
  workspacePath: ${EVAL_WORKSPACE}
logger: { level: warn }
audit: { enabled: false }
rateLimit: { max: 0 }
scripts: { enabled: true }
authentication:
  adapter: local
  type: apikey
  keys:
    - { name: reader, value: eval-reader, permissions: [ read ] }
    - { name: writer, value: eval-writer, permissions: [ read, write ] }
    - { name: runner, value: eval-runner }
transports:
  http:
    port: ${EVAL_HTTP_PORT}
    host: 127.0.0.1
  mcpHttp:
    port: ${EVAL_MCP_PORT}
    host: 127.0.0.1
    legacySse: false
